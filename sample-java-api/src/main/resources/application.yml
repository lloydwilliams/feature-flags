spring:
  application:
    name: sample-java-api
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

sample:
  cors:
    # sample-react's Vite dev server (see sample-react/vite.config.ts) plus the
    # default Vite port, so either works without a config change.
    allowed-origins: http://localhost:5174,http://localhost:5173
  profile:
    # true -> unknown emails return 404 instead of a derived demo profile
    strict-directory: false
  flags:
    # Flag read per getUserProfile call and reported in the DEBUG line. Nothing
    # is gated on it yet - it exists to show the provider resolving.
    readout-key: show-new-feature
    # Flag that gates StartAIScan. Must exist as a server-side flag, not only a
    # RUM one, or it resolves FLAG_NOT_FOUND and the scan stays gated off.
    ai-scan-key: show-ai-scan
    # Bound on how long startup waits for the first flag configuration.
    init-timeout-seconds: 5

# Logging - appenders, pattern, levels, and rotation - lives in
# logback-spring.xml. Levels are deliberately not set here too: a
# logging.level.* entry would override the XML and split one decision across
# two files.
