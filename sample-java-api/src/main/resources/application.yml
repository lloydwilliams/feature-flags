spring:
  application:
    name: sample-java-api
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

sample:
  cors:
    # sample-react's Vite dev server (see sample-react/vite.config.ts) plus the
    # default Vite port, so either works without a config change.
    allowed-origins: http://localhost:5174,http://localhost:5173
  profile:
    # true -> unknown emails return 404 instead of a derived demo profile
    strict-directory: false

logging:
  level:
    com.example.samplejavaapi: INFO

  # Log file for the Datadog Agent to tail. Relative to the working directory,
  # which run-sample-java-api.sh sets to sample-java-api/.
  file:
    name: logs/sample-java-api.log

  structured:
    format:
      # JSON on disk only; the console stays human-readable for local runs.
      #
      # logstash rather than ecs because it puts MDC entries at the top level,
      # so the dd.trace_id and dd.span_id that -Ddd.logs.injection=true adds
      # land where Datadog looks for them and logs correlate with APM traces.
      file: logstash

  logback:
    rollingpolicy:
      file-name-pattern: logs/sample-java-api.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 10MB
      max-history: 7
      # Bounded, so a long-running demo cannot fill the disk.
      total-size-cap: 100MB
